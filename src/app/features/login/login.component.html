<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
      INTEGRY DT
    </div>
    <h2>Iniciar Sesión</h2>
    <p class="subtitle">Demo autónoma · no requiere Backend ni MySQL</p>

    <div class="demo-box">
      <strong>Acceso de demostración</strong>
      <span>Usuario: <code>demo@integrydt.local</code></span>
      <span>Contraseña: <code>Demo1234!</code></span>
    </div>

    @if (error()) {
      <div class="alert-error">{{ error() }}</div>
    }

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input class="form-control" type="email" [(ngModel)]="email" name="email" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input class="form-control" type="password" [(ngModel)]="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" style="margin-top:8px" [disabled]="loading()">
        {{ loading() ? 'Ingresando...' : 'Ingresar al modo demo' }}
      </button>
    </form>
  </div>
</div>
